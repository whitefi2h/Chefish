<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Chefish · 思源黑体排版微调</title><style>*{box-sizing:border-box}body{margin:0;padding:28px;font:15px/1.5 "Microsoft YaHei UI",sans-serif;color:#252b26;background:#f7f8f5}h1{font-size:26px;font-weight:500}p{color:#6f756f}nav{display:flex;flex-wrap:wrap;gap:10px;margin:18px 0}button,select{font:inherit;color:inherit;padding:9px 14px;background:white;border:1px solid #e5e9e2;border-radius:10px;cursor:pointer}button[aria-pressed=true]{color:#b43f15;background:#fff0e6}button:focus-visible,select:focus-visible,a:focus-visible{outline:2px solid #cf4818;outline-offset:3px}.pair{display:grid;grid-template-columns:1fr 1fr;gap:16px}article{background:white;border-radius:16px;padding:16px;min-width:0}h2{font-size:17px;font-weight:500}img{display:block;width:100%;height:auto}.frame{overflow:auto}a{color:#b43f15}#native{max-width:1500px;margin:auto}small{display:block;margin:12px 0;color:#6f756f}[hidden]{display:none!important}@media(max-width:850px){body{padding:16px}.pair{grid-template-columns:1fr}}</style><h1>思源黑体 · 第 10 组基础上的排版微调</h1><p>Semibold 标题与强调 / Medium 正文。菜谱名 16px；最大化四列、普通窗口三列。库存关键数据统一 14px；日期数字改用 Georgia 衬线体。</p><nav><button data-mode="native" aria-pressed="true">实机结果</button><button data-mode="compare" aria-pressed="false">开发视口前后对照</button><select id="page" aria-label="检查页面"><option value="home">首页右栏</option><option value="recipes">菜谱</option><option value="inventory">食材库存</option><option value="shopping">采购清单</option></select></nav><p id="note"></p><div id="content"></div><small>全部使用隔离演示数据。实机结果为 Windows WebView2 窗口截图；前后对照为同一 1490×900 浏览器视口。图片原尺寸可通过链接打开，不含对个人数据库的验收声明。<a href="TYPE_POLISH.md">修改及验证记录</a></small><script>let mode='native';function render(){const page=document.querySelector('#page').value;const root='screenshots/type-polish/';const pics=mode==='native'?[['微调后 · Windows WebView2',root+'native/'+page+'.jpg']]:[['微调前 · 第 10 组',root+'before-'+page+'.png'],['微调后',root+'after-'+page+'.png']];document.querySelector('#note').textContent=mode==='native'?'实际应用组件，原生 WebView2 渲染；点击原图检查笔画和间距。':'相同视口、相同演示数据；菜谱列数保持三列，只比较字体与排版。';document.querySelector('#content').className=mode==='native'?'':'pair';document.querySelector('#content').innerHTML=pics.map(([name,path])=>`<article><h2>${name}</h2><div class="frame"><img src="${path}" alt="${name}：${page}"></div><a href="${path}" target="_blank">打开原尺寸截图 ↗</a>${mode==='native'&&page==='recipes'?'<p><a href="screenshots/type-polish/native/recipes-windowed.jpg" target="_blank">普通窗口三列原图 ↗</a></p>':''}</article>`).join('')}document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;document.querySelectorAll('[data-mode]').forEach(x=>x.setAttribute('aria-pressed',x===b));render()});document.querySelector('#page').onchange=render;render();</script></html>
